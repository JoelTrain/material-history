name: Docker build and smoke test
on:
  push:
    branches:
      - chore/dockerize-app
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - 'src/**'
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start demo container
        run: docker compose up --build --detach
      - name: Verify container serves the demo without a database
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:3000/ -o /tmp/material-history.html; then
              if grep -q 'DEMO MODE' /tmp/material-history.html; then
                echo "Database-free demo served successfully from Docker"
                exit 0
              fi
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --no-color app
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color app
      - name: Stop containers
        if: always()
        run: docker compose down
