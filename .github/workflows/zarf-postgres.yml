name: Validate Zarf PostgreSQL chart
on:
  push:
    branches: [chore/unify-compose]
    paths:
      - out/chart/**
      - .github/workflows/zarf-postgres.yml
  pull_request:
    branches: [main]
    paths:
      - out/chart/**
      - .github/workflows/zarf-postgres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.17.3
      - name: Lint and render generated Zarf chart
        run: |
          helm lint out/chart
          helm template material-history out/chart --namespace material-history-postgres > /tmp/rendered.yaml
      - name: Assert PostgreSQL volume ownership and probes
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          documents = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          db = next(d for d in documents if d and d.get('kind') == 'Deployment' and d.get('metadata', {}).get('name') == 'db')
          pod = db['spec']['template']['spec']
          security = pod['securityContext']
          assert security['fsGroup'] == 999, security
          assert security['fsGroupChangePolicy'] == 'OnRootMismatch', security
          container = pod['containers'][0]
          assert container['securityContext']['runAsUser'] == 999
          assert container['securityContext']['runAsNonRoot'] is True
          assert container['securityContext']['allowPrivilegeEscalation'] is False
          assert next(e['value'] for e in container['env'] if e['name'] == 'PGDATA') == '/var/lib/postgresql/data/pgdata'
          assert {'startupProbe', 'readinessProbe', 'livenessProbe'}.issubset(container)
          assert container['startupProbe']['failureThreshold'] >= 60
          print('Verified PostgreSQL restricted security context, subdirectory and startup/readiness/liveness probes.')
          PY
