# Combine with compose.yaml to enable a local PostgreSQL instance:
# NEXT_PUBLIC_DEMO_MODE=false PAYLOAD_SECRET=... docker compose -f compose.yaml -f compose.postgres.yaml up --build -d
services:
  app:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE: "false"
    environment:
      NEXT_PUBLIC_DEMO_MODE: "false"
      # Set PG credentials in .env; do not use defaults outside local development.
      DATABASE_URL: postgresql://${POSTGRES_USER:-material_history}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-material_history}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - material-history-data:/app/data
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-material_history}
      POSTGRES_USER: ${POSTGRES_USER:-material_history}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-material_history} -d ${POSTGRES_DB:-material_history}"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
