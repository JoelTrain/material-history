apiVersion: v1
kind: Service
metadata:
    name: app
    namespace: '{{ .Release.Namespace }}'
    labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: material-history
spec:
    selector:
        app.kubernetes.io/name: app
    ports:
        - name: port-3000-tcp
          port: 3000
          targetPort: 3000
          protocol: TCP
