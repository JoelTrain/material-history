# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
    name: material-history
    description: UDS package generated from Docker Compose for material-history
    version: dev
    annotations:
        dev.uds.icon: data:image/svg+xml;base64,
        dev.uds.tagline: Material History automatically generated by Docker Compose Bridge UDS.
        dev.uds.title: Material History
variables:
    - name: SUBDOMAIN
      description: Subdomain for the first inferred tenant-gateway endpoint and inferred SSO redirect URI; empty uses the Helm release namespace
      default: ""
    - name: DOMAIN
      description: The domain for accessing endpoints
      default: uds.dev
    - name: ADDITIONAL_NETWORK_ALLOW
      description: Additional UDS network allow rules (YAML array)
      default: '[]'
      autoIndent: true
    - name: APP_CPU_REQUEST
      description: CPU request for compose service app
      default: ""
    - name: APP_MEMORY_REQUEST
      description: Memory request for compose service app
      default: ""
    - name: APP_CPU_LIMIT
      description: CPU limit for compose service app
      default: ""
    - name: APP_MEMORY_LIMIT
      description: Memory limit for compose service app
      default: ""
    - name: APP_DATABASE_URL
      description: Value for DATABASE_URL environment variable on compose service app
      default: postgresql://material_history:demo-only-change-me@db:5432/material_history
    - name: APP_HOSTNAME
      description: Value for HOSTNAME environment variable on compose service app
      default: 0.0.0.0
    - name: APP_NEXT_PUBLIC_DEMO_MODE
      description: Value for NEXT_PUBLIC_DEMO_MODE environment variable on compose service app
      default: "false"
    - name: APP_NEXT_PUBLIC_SITE_URL
      description: Value for NEXT_PUBLIC_SITE_URL environment variable on compose service app
      default: http://localhost:3000
    - name: APP_NODE_ENV
      description: Value for NODE_ENV environment variable on compose service app
      default: production
    - name: APP_PAYLOAD_SECRET
      description: Value for PAYLOAD_SECRET environment variable on compose service app
      default: demo-only-do-not-use-in-production
    - name: APP_PORT
      description: Value for PORT environment variable on compose service app
      default: "3000"
    - name: DB_CPU_REQUEST
      description: CPU request for compose service db
      default: ""
    - name: DB_MEMORY_REQUEST
      description: Memory request for compose service db
      default: ""
    - name: DB_CPU_LIMIT
      description: CPU limit for compose service db
      default: ""
    - name: DB_MEMORY_LIMIT
      description: Memory limit for compose service db
      default: ""
    - name: DB_POSTGRES_DB
      description: Value for POSTGRES_DB environment variable on compose service db
      default: material_history
    - name: DB_POSTGRES_PASSWORD
      description: Value for POSTGRES_PASSWORD environment variable on compose service db
      default: demo-only-change-me
    - name: DB_POSTGRES_USER
      description: Value for POSTGRES_USER environment variable on compose service db
      default: material_history
components:
    - name: material-history
      required: true
      description: Deploy material-history
      only:
        flavor: upstream
      charts:
        - name: material-history
          namespace: material-history-postgres
          localPath: chart
          version: 0.0.0-dev
          valuesFiles:
            - values/values.yaml
      images:
        - postgres:17-bookworm
        - ghcr.io/defenseunicorns/compose-bridge-uds/wait@sha256:5a1f8bb73a3eae5650460e95bf438d74d33532e8633d3a7aacada266849763a7
      imageArchives:
        - path: image-archives/app.tar
          images:
            - zarf.internal/material-history-app:dev
      actions:
        onCreate:
            before:
                - description: Ensure the Compose Bridge Buildx builder exists
                  cmd: |-
                    set -eu
                    docker_context="$(docker context show)"
                    builder_context="$(printf '%s' "$docker_context" | tr -c '[:alnum:]_.-' '-')"
                    builder_name='compose-bridge-uds-'"$builder_context"
                    if ! docker buildx inspect "$builder_name" >/dev/null 2>&1; then
                      docker buildx create --name "$builder_name" --driver docker-container "$docker_context"
                    fi
                - description: Build Compose images for the package
                  cmd: |-
                    set -eu
                    docker_context="$(docker context show)"
                    builder_context="$(printf '%s' "$docker_context" | tr -c '[:alnum:]_.-' '-')"
                    builder_name='compose-bridge-uds-'"$builder_context"
                    mkdir -p 'image-archives'
                    rm -f 'image-archives/app.tar'
                    docker buildx bake \
                      --builder "$builder_name" \
                      --file 'build.compose.yaml' \
                      --progress plain \
                      --allow 'fs.read=/Users/joel.birlingmair/projects/not-cui/material-history-2' \
                      --set 'app.platform+=linux/amd64' \
                      --set 'app.platform+=linux/arm64' \
                      --set 'app.output=type=oci,dest=image-archives/app.tar' \
                      'app'
documentation:
    configuration: docs/configuration.md
    conversion: docs/conversion.md
    dependencies: docs/dependencies.md
    readme: docs/README.md
